<!doctype html>
<html lang="en" data-page-title="Debug">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Swing Time — Debug</title>
  <meta name="theme-color" content="#0b0e13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Swing Time" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css?v=8" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Debug</h1>
      <nav>
        <a class="small-link" id="back-link" href="play.html">Back to playing</a>
        <a class="small-link" href="index.html">Home</a>
      </nav>
    </header>

    <section class="panel">
      <p class="section-title">Bells</p>
      <p class="small-link" id="bell-status">Loading bells…</p>
      <div class="bell-grid" id="bell-grid"></div>
      <button type="button" class="btn btn-primary" id="play-all">▶ Play all 15</button>
    </section>

    <section class="panel">
      <p class="section-title">Role</p>
      <p id="role-line"></p>
      <div class="controls" style="margin-top:0">
        <div class="seg" id="hand-seg" role="group" aria-label="Hand">
          <button type="button" data-hand="right"><span>Right hand</span></button>
          <button type="button" data-hand="left"><span>Left hand</span></button>
        </div>
        <label class="check"><input type="checkbox" id="toddler-test" /> Test Toddler trigger</label>
      </div>
    </section>

    <section class="panel">
      <button type="button" class="btn btn-primary btn-big" id="motion-btn" style="width:100%">Enable Motion</button>
      <p id="status" class="small-link">Tap Enable Motion, then swing.</p>
      <div class="readout">
        <div><small>x</small><b id="r-x">–</b></div>
        <div><small>y</small><b id="r-y">–</b></div>
        <div><small>z</small><b id="r-z">–</b></div>
        <div><small>|accel| m/s²</small><b id="r-mag">–</b></div>
        <div><small>rotation °/s</small><b id="r-rot">–</b></div>
        <div><small>peak |accel|</small><b id="r-peak">–</b></div>
      </div>
    </section>

    <section class="panel">
      <p class="section-title">Thresholds (saved on this phone)</p>
      <div id="sliders"></div>
      <button type="button" class="btn" id="reset-btn">Reset to defaults</button>
    </section>

    <section class="panel">
      <p class="section-title">Detected</p>
      <ul class="log" id="log"></ul>
    </section>
  </main>

  <script src="js/config.js?v=8"></script>
  <script src="js/notes.js?v=8"></script>
  <script src="js/lanes.js?v=8"></script>
  <script src="js/settings.js?v=8"></script>
  <script src="js/songs.js?v=8"></script>
  <script src="js/audio.js?v=8"></script>
  <script src="js/gestures.js?v=8"></script>
  <script src="js/debug.js?v=8"></script>
</body>
</html>
