<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Handbell</title>
  <meta name="theme-color" content="#101418" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Handbell</h1>
    <nav class="header-links">
      <a class="nav-link" href="score.html">Score</a>
      <a class="nav-link" href="help.html">Help</a>
      <a class="nav-link" href="debug.html">Debug</a>
    </nav>
  </header>

  <main>
    <section class="panel">
      <div class="control-group">
        <p class="section-title">Hand</p>
        <div class="tetrachord-toggle">
          <button type="button" data-hand="right">Right-handed</button>
          <button type="button" data-hand="left">Left-handed</button>
        </div>
      </div>

      <div class="control-group">
        <p class="section-title">Tetrachord</p>
        <div class="tetrachord-toggle">
          <button type="button" data-tetrachord="lower">Lower</button>
          <button type="button" data-tetrachord="upper">Upper</button>
        </div>
      </div>

      <div class="note-list">
        <button type="button" class="note-chip">Down<strong>Do</strong></button>
        <button type="button" class="note-chip">Up<strong>Re</strong></button>
        <button type="button" class="note-chip">Left<strong>Mi</strong></button>
        <button type="button" class="note-chip">Right<strong>Fa</strong></button>
      </div>
    </section>

    <div class="stage panel">
      <div id="note-flash">—</div>
    </div>

    <section class="panel">
      <button id="enable-motion" class="primary-button" type="button">Enable Motion</button>
      <p id="status-line" class="status-line">Tap Enable Motion to start ringing.</p>
    </section>
  </main>

  <script src="js/notes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/gesture-detector.js"></script>
  <script src="js/wake-lock.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
